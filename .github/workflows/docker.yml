name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: 2.0.0
  IMAGE_NAME: devops-flask-postgres
  OWNER_NAME: agentsmith04

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build \
          -t ghcr.io/${{ env.OWNER_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          -t ghcr.io/${{ env.OWNER_NAME }}/${{ env.IMAGE_NAME }}:latest \
          .

      - name: Publicar imagen en GHCR
        run: |
          docker push ghcr.io/${{ env.OWNER_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ env.OWNER_NAME }}/${{ env.IMAGE_NAME }}:latest